<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERICK HACKER | LU</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#00ff41;font-family:'Courier New',monospace;overflow:hidden;height:100vh}
canvas{position:fixed;top:0;left:0;z-index:0}
#terminal{position:relative;z-index:1;background:rgba(0,0,0,0.85);margin:10px;border:1px solid #00ff41;box-shadow:0 0 20px #00ff41;height:calc(100vh - 20px);display:flex;flex-direction:column;padding:15px}
#output{flex:1;overflow-y:auto;white-space:pre-wrap;line-height:1.6}
#input-line{display:flex;gap:8px;margin-top:10px}
#prompt{color:#00ff41;white-space:nowrap}
#cmd{flex:1;background:transparent;border:none;color:#00ff41;font-family:inherit;font-size:16px;outline:none}
a{color:#00ff41}
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div id="terminal">
<div id="output">ERICK HACKER OS v3.0 [Luanda - AO]
Kernel: Matrix Mode ON

Digite 'help' para comandos.

</div>
<div id="input-line">
<span id="prompt">erick@luanda:~$</span>
<input id="cmd" autofocus autocomplete="off">
</div>
</div>
<script>
const c=document.getElementById('matrix'),ctx=c.getContext('2d');
c.width=window.innerWidth;c.height=window.innerHeight;
const chars="01ERICK".split(""),drops=[];
for(let i=0;i<c.width/14;i++)drops[i]=1;
function draw(){ctx.fillStyle="rgba(0,0,0,0.05)";ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle="#00ff41";ctx.font="14px monospace";drops.forEach((y,i)=>{const t=chars[Math.floor(Math.random()*chars.length)];ctx.fillText(t,i*14,y*14);if(y*14>c.height&&Math.random()>0.975)drops[i]=0;drops[i]++});}
setInterval(draw,35);
const out=document.getElementById('output'),input=document.getElementById('cmd');
const cmds={
help:`Comandos:
  whoami    - quem sou
  skills    - habilidades
  hack      - invasão
  clear     - limpar`,
whoami:`\n> ERICK HACKER\n> Luanda, Angola\n> Dev Frontend & Hacker Criativo\n`,
skills:`\n[SKILLS] HTML 95% | JS 90% | Termux 100%\n`,
clear:``
};
input.addEventListener('keydown',e=>{
if(e.key==='Enter'){
const raw=input.value;const v=raw.trim().toLowerCase();
const p=document.createElement('div');p.textContent=`erick@luanda:~$ ${raw}`;out.appendChild(p);
if(v==='clear'){out.innerHTML="";input.value="";return;}
let res="";
if(v==='hack'){res="\n[INVADINDO...]\n> Conectando Luanda... OK\n> Firewall bypass... OK\n> Acesso ROOT concedido!\n";}
else{res=cmds[v]||`\nComando '${v}' não existe. Digite 'help'\n`;}
const d=document.createElement('div');d.textContent=res;out.appendChild(d);
out.scrollTop=out.scrollHeight;input.value="";
}
});
</script>
</body>
</html>
