<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<title>ERICK AI V2</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;margin:0;padding:10px}
#chat{max-width:700px;margin:auto;border:2px solid #0f0;border-radius:10px;height:85vh;display:flex;flex-direction:column}
#msgs{flex:1;overflow-y:auto;padding:10px}
.msg{margin:10px 0;padding:10px;border-radius:10px;word-wrap:break-word}
.user{background:#003300;text-align:right}
.ai{background:#001100;border:1px solid #0f0}
#inputArea{display:flex;border-top:2px solid #0f0}
input{flex:1;background:#000;color:#0f0;border:none;padding:15px;font-family:monospace;outline:none}
button{background:#0f0;color:#000;border:none;padding:15px;font-weight:bold;cursor:pointer}
h1{text-align:center;text-shadow:0 0 10px #0f0;font-size:22px}
.loading{color:#888;font-style:italic}
</style>
</head>
<body>
<h1>🤖 ERICK AI V2 - Responde TUDO</h1>
<div id="chat">
<div id="msgs">
<div class="msg ai">Fala Erick! Agora sou V2 com inteligência real! Pergunte qualquer coisa do mundo que eu respondo de verdade!</div>
</div>
<div id="inputArea">
<input id="pergunta" placeholder="Pergunte qualquer coisa...">
<button onclick="responder()">ENVIAR</button>
</div>
</div>
<script>
async function responder(){
 let input=document.getElementById("pergunta");
 let txt=input.value.trim();
 if(!txt) return;
 addMsg(txt,"user");
 input.value="";
 let loadingId = addMsg("Pensando... 🤔","ai loading");
 try{
  let res = await fetch("https://text.pollinations.ai/"+encodeURIComponent(txt));
  let data = await res.text();
  document.getElementById(loadingId).remove();
  addMsg(data,"ai");
 }catch(e){
  document.getElementById(loadingId).remove();
  addMsg("Erro na conexão, mas ainda sei: "+txt+" -> Sou o ERICK AI criado pelo Erick! Tenta de novo!","ai");
 }
}
function addMsg(t,c){
 let m=document.createElement("div");
 let id="msg"+Date.now()+Math.random();
 m.id=id;
 m.className="msg "+c;
 m.innerHTML=t;
 document.getElementById("msgs").appendChild(m);
 document.getElementById("msgs").scrollTop=99999;
 return id;
}
document.getElementById("pergunta").addEventListener("keydown",e=>{if(e.key==="Enter")responder()});
</script>
</body>
</html>
